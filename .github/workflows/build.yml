name: Build Tokyo Ghoul RPG 2.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v5
        with:
          name: TokyoGhoulRPG-2.0.0
          path: build/libs/*.jar
